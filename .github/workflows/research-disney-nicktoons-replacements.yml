name: Research Disney and Nicktoons replacement media (no deploy)

on:
  pull_request:
    paths:
      - ".github/workflows/research-disney-nicktoons-replacements.yml"
      - "research/disney_nicktoons_replacements_20261013.json"
      - "research/disney_nicktoons_replacement_hunt.py"
      - "tests/test_disney_nicktoons_replacement_hunt.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replacement-hunt:
    name: "Independent-host research — ${{ matrix.channel }}"
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        channel: ["DisneyChannel.us", "Nicktoons.us"]
    steps:
      - uses: actions/checkout@v4
      - name: Compile independent-host research
        run: |
          python3 -m compileall -q research/disney_nicktoons_replacement_hunt.py
          python3 -m unittest tests.test_disney_nicktoons_replacement_hunt -v
      - name: Install real FFmpeg (don't mask missing binary)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          ffmpeg -version
      - name: Probe three GitHub-documented source hosts per target
        run: |
          python3 -m research.disney_nicktoons_replacement_hunt \
            --channel "${{ matrix.channel }}" \
            --decode \
            --output research-results/replacement
      - name: Upload research-only per-source status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disney-nick-research-${{ matrix.channel }}
          path: research-results/replacement/
          if-no-files-found: warn
          retention-days: 10
