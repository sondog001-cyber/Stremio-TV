name: Targeted origin-aware source discovery (research only)
on:
  pull_request:
    paths:
      - "research/origin_aware_targeted_discovery.py"
      - "tests/test_origin_aware_targeted_discovery.py"
      - ".github/workflows/origin-aware-targeted-discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-origin-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate origin and safety filters without probing
        run: python -m unittest discover -s tests -p 'test_origin_aware_targeted_discovery.py' -v
      - name: Perform targeted source discovery and independent media probes
        run: python research/origin_aware_targeted_discovery.py
      - name: Upload all research diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: origin-aware-targeted-source-report
          path: research/diagnostics/origin-aware-targeted-discovery.json
          retention-days: 14
