name: Recovery runner diagnostics
on:
  push:
    branches: [diagnostics/recovery-20261109]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python assemble_build.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate public provider candidates without deploying
        run: |
          python - provider-validation github-runner-repeat <<'PYCODE'
          import pathlib
          p=pathlib.Path("provider-validation");p.mkdir(exist_ok=True)
          (p/"candidates.json").write_text('[{"provider": "eja.tv", "source_page": "http://eja.tv/?search=Fox+News&country=us", "channel_label": "Fox News Channel", "tvg_id": "FoxNewsChannel.us", "url": "https://tvsen6.aynaott.com/foxnews/index.m3u8", "endpoint_sha256": "a07b89b6faf7a6472524df6d5a3a3077e0f17dd28cc26a84d0f0e5f84574e768", "host": "tvsen6.aynaott.com", "screening": "test", "identity": "unverified"}, {"provider": "eja.tv", "source_page": "http://eja.tv/?search=USA+Network&country=us", "channel_label": "USA Network", "tvg_id": "USANetwork.us", "url": "https://tvsen3.aynaott.com/dbbcY6NG/index.m3u8", "endpoint_sha256": "6b4f4dc7af547cbaf949139396c2fd081ccbe953515cd7986b2d3c1dc0d5c416", "host": "tvsen3.aynaott.com", "screening": "test", "identity": "unverified"}, {"provider": "eja.tv", "source_page": "http://eja.tv/?search=NFL+Network&country=us", "channel_label": "NFL Network", "tvg_id": "NFLNetwork.us", "url": "https://tvsen6.aynaott.com/nfl/index.m3u8", "host": "tvsen6.aynaott.com", "endpoint_sha256": "956abb40da052a817ff0219e1b3a38a7453e617a803587c81b532a12889bbde2", "screening": "test", "identity": "Unverified; latest production loss"}]')
          import concurrent.futures,datetime,hashlib,json,pathlib,subprocess,sys,urllib.request,urllib.error
          sys.path.insert(0,str(pathlib.Path('repo').resolve()) if pathlib.Path('repo/build.py').exists() else str(pathlib.Path('.').resolve()))
          import build
          root=pathlib.Path(sys.argv[1]) if len(sys.argv)>1 else pathlib.Path('provider-validation')
          config=json.load(open('repo/config.json' if pathlib.Path('repo/config.json').exists() else 'config.json'))
          candidates=json.load(open(root/'candidates.json'));results=[]
          kept,quarantined=build.apply_stream_quarantine([dict(c,name=c['channel_label'],source=c['provider']) for c in candidates],config)
          allowed={c['url'] for c in kept}
          candidates=[c for c in candidates if c['url'] in allowed]
          (root/'quarantined.json').write_text(json.dumps(quarantined,indent=2))
          def test(c):
           r={**c,'environment':sys.argv[2] if len(sys.argv)>2 else 'local','tested_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'playlist':{'status':'not-tested'},'segment':{'status':'not-tested'},'burn_in':{'status':'not-tested'},'decode':{'status':'not-tested'},'sustained_av':{'status':'not-tested'}}
           try:
            req=urllib.request.Request(c['url'],headers={'User-Agent':build.USER_AGENT})
            with urllib.request.urlopen(req,timeout=8) as p:b=p.read(262144);r['playlist']={'status':'ok' if b.lstrip().startswith(b'#EXTM3U') else 'invalid','http_status':p.status,'bytes':len(b),'final_url':p.url}
           except Exception as e:
            r['playlist']={'status':'failed','error':type(e).__name__,'detail':str(e)}
            return r
           if r['playlist']['status']!='ok':return r
           health=build._probe_stream({'url':c['url']},8,True);r['segment']=health
           return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(test,candidates))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          entries=[{'url':r['url'],'name':r['channel_label'],'tvg_id':r['tvg_id'],'source':'Provider catalog validation','family':r['provider'],'quality':'Unknown'} for r in results if r['segment'].get('status')=='ok']
          if entries:
           good,rows,state=build.probe_candidate_entries(entries,config)
           byurl={r['url']:r for r in rows}
           for r in results:
            if r['url'] not in byurl:continue
            health=byurl[r['url']]['health'];r['burn_in']=health
            if health.get('status')!='ok':continue
            stream={'url':r['url'],'health':health}
            r['decode']=build._validate_primary_playback_stream(stream,config['stream_health']['primary_playback_qa'])
            if r['decode'].get('status')!='ok':continue
            # Require 60 seconds of BOTH video and audio decoding, in addition to configured repeat/stall QA.
            cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-user_agent',build.USER_AGENT,'-rw_timeout','10000000','-i',r['url'],'-t','60','-map','0:v:0','-map','0:a:0','-progress','pipe:1','-f','null','-']
            try:
             p=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
             times=[int(x.split('=',1)[1]) for x in p.stdout.splitlines() if x.startswith('out_time_us=') and x.split('=',1)[1].isdigit()]
             seconds=max(times,default=0)/1e6
             r['sustained_av']={'status':'ok' if p.returncode==0 and seconds>=59 else 'failed','decoded_seconds':seconds,'exit_code':p.returncode,'error':p.stderr[-1000:]}
            except subprocess.TimeoutExpired:r['sustained_av']={'status':'failed','error':'90-second timeout'}
          (root/'results.json').write_text(json.dumps(results,indent=2))
          for r in results:print(r['provider'],r['channel_label'],r['host'],'playlist',r['playlist'].get('status'),'segment',r['segment'].get('status'),'burn',r['burn_in'].get('status'),'decode',r['decode'].get('status'),'AV60',r['sustained_av'].get('status'))
          
          for row in results:
              if row['decode'].get('status')!='ok':continue
              prefix=row['tvg_id'].replace('.','-')
              try:
                  cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-rw_timeout','8000000','-i',row['url'],'-vf','fps=1/20,scale=640:-2','-frames:v','4','-t','80','-y',str(root/(prefix+'-%02d.jpg'))]
                  cp=subprocess.run(cmd,capture_output=True,text=True,timeout=100)
                  row['identity_capture']={'exit_code':cp.returncode,'error':cp.stderr[-500:]}
              except subprocess.TimeoutExpired:row['identity_capture']={'error':'timeout'}
          (root/'results.json').write_text(json.dumps(results,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: recovery-provider-validation-repeat
          path: provider-validation/
