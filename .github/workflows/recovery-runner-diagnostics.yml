name: Recovery runner diagnostics
on:
  push:
    branches: [diagnostics/recovery-20261109]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: python assemble_build.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate next fresh five-channel source batch
        run: |
          python - five-channel-recovery/batch2 github-runner <<'PYCODE'
          import pathlib
          p=pathlib.Path("five-channel-recovery/batch2");p.mkdir(parents=True,exist_ok=True)
          (p/"candidates.json").write_text('[{"tvg_id": "CBSSportsNetwork.us", "channel_label": "CBSSportsNetwork.us", "url": "https://fl31.moveonjoy.com/CBS_SPORTS_NETWORK/index.m3u8", "provider": "fl31.moveonjoy.com", "source_page": "https://github.com/judy-gotv/iptv/blob/main/Moveonjoy.m3u", "host": "fl31.moveonjoy.com", "endpoint_sha256": "f612b3ce8e2f6b9da5c5de868c23549d03b2186e04e23bd15bb1a92a9893d4f5", "identity": "unverified", "screening": "test"}, {"tvg_id": "Pop.us", "channel_label": "Pop.us", "url": "http://fl41.moveonjoy.com/Pop_TV/mpegts", "provider": "fl41.moveonjoy.com", "source_page": "https://github.com/judy-gotv/iptv/blob/main/Moveonjoy.m3u", "host": "fl41.moveonjoy.com", "endpoint_sha256": "08600f8091ecdf3f5a3dfb3a81528d0ef6f355c19b4b279e02ffcc4e86eecb9c", "identity": "unverified", "screening": "test"}, {"tvg_id": "Fox.us@WTXFTV", "channel_label": "Fox.us@WTXFTV", "url": "http://fl41.moveonjoy.com/PA_PHILADELPHIA_FOX/index.m3u8", "provider": "fl41.moveonjoy.com", "source_page": "https://github.com/judy-gotv/iptv/blob/main/Moveonjoy.m3u", "host": "fl41.moveonjoy.com", "endpoint_sha256": "df2fad31dd061ba2ef6022ea5f83365715b36c368435dd6b9a344dae09cf93e6", "identity": "unverified", "screening": "test"}, {"tvg_id": "USANetwork.us", "channel_label": "USANetwork.us", "url": "https://o4.greektoday.shop/usa-usanetwork.m3u8", "provider": "o4.greektoday.shop", "source_page": "https://github.com/judy-gotv/iptv/blob/main/FSTV24.m3u8", "host": "o4.greektoday.shop", "endpoint_sha256": "0aa7220679977b06a97ad5a16150f18c824e35ca607a085e306cd89fad6a03a5", "identity": "unverified", "screening": "test"}, {"tvg_id": "NFLNetwork.us", "channel_label": "NFLNetwork.us", "url": "http://23.237.104.106:8080/USA_NFL_NETWORK/index.m3u8", "provider": "23.237.104.106", "source_page": "https://github.com/chingithub1/iptv/blob/main/Original", "host": "23.237.104.106", "endpoint_sha256": "4795f8ffa3bda0296ea5a81fb8aee77d65d2e60c17734d8fd35e17474655273c", "identity": "unverified", "screening": "test"}]')
          import concurrent.futures,datetime,hashlib,json,pathlib,subprocess,sys,urllib.request,urllib.error
          sys.path.insert(0,str(pathlib.Path('repo').resolve()) if pathlib.Path('repo/build.py').exists() else str(pathlib.Path('.').resolve()))
          import build
          root=pathlib.Path(sys.argv[1]) if len(sys.argv)>1 else pathlib.Path('provider-validation')
          config=json.load(open('repo/config.json' if pathlib.Path('repo/config.json').exists() else 'config.json'))
          candidates=json.load(open(root/'candidates.json'));results=[]
          kept,quarantined=build.apply_stream_quarantine([dict(c,name=c['channel_label'],source=c['provider']) for c in candidates],config)
          allowed={c['url'] for c in kept}
          candidates=[c for c in candidates if c['url'] in allowed]
          (root/'quarantined.json').write_text(json.dumps(quarantined,indent=2))
          def test(c):
           r={**c,'environment':sys.argv[2] if len(sys.argv)>2 else 'local','tested_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'playlist':{'status':'not-tested'},'segment':{'status':'not-tested'},'burn_in':{'status':'not-tested'},'decode':{'status':'not-tested'},'sustained_av':{'status':'not-tested'}}
           try:
            req=urllib.request.Request(c['url'],headers={'User-Agent':build.USER_AGENT})
            with urllib.request.urlopen(req,timeout=8) as p:b=p.read(262144);r['playlist']={'status':('ok' if b.lstrip().startswith(b'#EXTM3U') else 'direct-media' if b[:1]==b'G' and b[188:189]==b'G' else 'invalid'),'http_status':p.status,'bytes':len(b),'final_url':p.url}
           except Exception as e:
            r['playlist']={'status':'failed','error':type(e).__name__,'detail':str(e)}
            return r
           if r['playlist']['status'] not in ('ok','direct-media'):return r
           health=build._probe_stream({'url':c['url']},8,True);r['segment']=health
           return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(test,candidates))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          entries=[{'url':r['url'],'name':r['channel_label'],'tvg_id':r['tvg_id'],'source':'Provider catalog validation','family':r['provider'],'quality':'Unknown'} for r in results if r['segment'].get('status')=='ok']
          if entries:
           good,rows,state=build.probe_candidate_entries(entries,config)
           byurl={r['url']:r for r in rows}
           for r in results:
            if r['url'] not in byurl:continue
            health=byurl[r['url']]['health'];r['burn_in']=health
            if health.get('status')!='ok':continue
            stream={'url':r['url'],'health':health}
            r['decode']=build._validate_primary_playback_stream(stream,config['stream_health']['primary_playback_qa'])
            if r['decode'].get('status')!='ok':continue
            # Require 60 seconds of BOTH video and audio decoding, in addition to configured repeat/stall QA.
            cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-user_agent',build.USER_AGENT,'-rw_timeout','10000000','-i',r['url'],'-t','60','-map','0:v:0','-map','0:a:0','-progress','pipe:1','-f','null','-']
            try:
             p=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
             times=[int(x.split('=',1)[1]) for x in p.stdout.splitlines() if x.startswith('out_time_us=') and x.split('=',1)[1].isdigit()]
             seconds=max(times,default=0)/1e6
             r['sustained_av']={'status':'ok' if p.returncode==0 and seconds>=60 else 'failed','decoded_seconds':seconds,'exit_code':p.returncode,'error':p.stderr[-1000:]}
            except subprocess.TimeoutExpired:r['sustained_av']={'status':'failed','error':'90-second timeout'}
          (root/'results.json').write_text(json.dumps(results,indent=2))
          for r in results:print(r['provider'],r['channel_label'],r['host'],'playlist',r['playlist'].get('status'),'segment',r['segment'].get('status'),'burn',r['burn_in'].get('status'),'decode',r['decode'].get('status'),'AV60',r['sustained_av'].get('status'))
          
          for row in results:
              if row['decode'].get('status')!='ok':continue
              name=row['tvg_id'].replace('.','-')
              try:
                  cp=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-rw_timeout','8000000','-i',row['url'],'-frames:v','1','-y',str(root/(name+'.jpg'))],capture_output=True,text=True,timeout=25)
                  row['capture_exit']=cp.returncode
              except subprocess.TimeoutExpired:row['capture_error']='timeout'
          (root/'results.json').write_text(json.dumps(results,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: five-channel-recovery-batch2
          path: five-channel-recovery/batch2/
