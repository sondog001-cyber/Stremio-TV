name: Recovery runner diagnostics
on:
  push:
    branches: [diagnostics/recovery-20261109]
permissions:
  contents: read
jobs:
  stop-rejected-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: Stop only the exact diagnostic run rejected by automatic review
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run_id = 44784759208;
            const {data: run} = await github.rest.actions.getWorkflowRun({owner, repo, run_id});
            if (run.head_branch !== 'diagnostics/recovery-20261109' ||
                run.head_sha !== '2d18efcf31fdeea109efa03205a4146c7402395d' ||
                run.event !== 'push' ||
                run.path !== '.github/workflows/recovery-runner-diagnostics.yml') {
              throw new Error('Refusing to cancel a run outside the exact rejected diagnostic scope');
            }
            if (run.status !== 'completed') {
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id});
              core.info('Requested cancellation of the exact rejected diagnostic only');
            } else {
              core.info('Rejected diagnostic already completed; no cancellation performed');
            }
