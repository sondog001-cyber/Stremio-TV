name: Recovery runner diagnostics
on:
  push:
    branches: [diagnostics/recovery-20261109]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect only public NFL player metadata without access headers
        run: |
          python - <<'PYCODE'
          import urllib.request,urllib.parse,re,json,pathlib,html
          from html.parser import HTMLParser
          p=pathlib.Path('five-channel-recovery/batch15');p.mkdir(parents=True,exist_ok=True)
          page='https://taifood-blog.asia/embed/nfl-network'
          class Tags(HTMLParser):
           def __init__(self):super().__init__();self.assets=[]
           def handle_starttag(self,tag,attrs):
            attrs=dict(attrs)
            if tag in ('script','iframe','video','source') and attrs.get('src'):self.assets.append((tag,attrs['src']))
          def safe_url(value,base):
           u=urllib.parse.urljoin(base,html.unescape(value));x=urllib.parse.urlsplit(u)
           return u if x.scheme=='https' and not x.username and not x.password and not x.query and not x.fragment else None
          out={'page':page,'headers_supplied':False}
          try:
           with urllib.request.urlopen(page,timeout=12) as response:body=response.read(500000).decode(errors='replace');out['http_status']=response.status
           out['title']=re.findall(r'<title>(.*?)</title>',body,re.S)[:1]
           out['challenge_detected']=bool(re.search(r'challenge-platform|cf-chl-|turnstile|captcha',body,re.I))
           out['drm_detected']=bool(re.search(r'widevine|playready|licenseUrl',body,re.I))
           parser=Tags();parser.feed(body)
           out['public_assets']=[{'tag':tag,'url':u} for tag,value in parser.assets if (u:=safe_url(value,page))]
           out['script_metadata']=[]
           if not out['challenge_detected'] and not out['drm_detected']:
            scripts=[x['url'] for x in out['public_assets'] if x['tag']=='script' and urllib.parse.urlsplit(x['url']).hostname==urllib.parse.urlsplit(page).hostname]
            for url in scripts[:2]:
             try:
              with urllib.request.urlopen(url,timeout=12) as response:script=response.read(500000).decode(errors='replace')
              apis=sorted(set(re.findall(r'[\"\'](/api/[A-Za-z0-9_./-]+)[\"\']',script)))
              out['script_metadata'].append({'url':url,'bytes':len(script),'public_api_paths':apis,'has_hls_literal':'.m3u8' in script,'mentions_drm':bool(re.search(r'widevine|playready|licenseUrl',script,re.I))})
              del script
             except Exception as error:out['script_metadata'].append({'url':url,'error':str(error)})
           del body
          except Exception as error:out['error']=str(error)
          (p/'metadata.json').write_text(json.dumps(out,indent=2));print(json.dumps(out,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: five-channel-recovery-batch15-public-player-metadata
          path: five-channel-recovery/batch15/
