name: Recovery runner diagnostics
on:
  push:
    branches: [diagnostics/recovery-20261109]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6a09f5f2602e81b386bb8f9d27d6e597b0545454
      - run: python assemble_build.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate next fresh five-channel source batch
        run: |
          python - five-channel-recovery/batch5 github-runner <<'PYCODE'
          import urllib.request,urllib.parse,json,re,time,pathlib,hashlib
          p=pathlib.Path('five-channel-recovery/batch5');p.mkdir(parents=True,exist_ok=True)
          rows=[];access=[]
          for channel,stream in [('USANetwork.us','F191'),('CBSSportsNetwork.us','F128')]:
           page='https://xstream.st/fslivepro.php?stream='+stream
           try:
            with urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0','Referer':'https://wikisport.info/'}),timeout=12) as r:s=r.read(1500000).decode()
            match=re.search(r'const\s+streamUrls\s*=\s*(\[.*?\]);',s)
            urls=json.loads(match.group(1)) if match else[]
            for u in urls:
             parsed=urllib.parse.urlsplit(u);q=urllib.parse.parse_qs(parsed.query)
             if parsed.scheme!='https' or parsed.hostname not in {'edge1.candyshop.st','edge2.candyshop.st','edge.candyshop.st','candyshop.st'} or parsed.path!='/live3/'+stream+'/index.m3u8' or parsed.username or parsed.password or set(q)!={'st','e'}:continue
             if not re.fullmatch('[A-Za-z0-9_-]{16,128}',q['st'][0]) or int(q['e'][0])-int(time.time())<10680:continue
             rows.append({'url':u,'channel_label':channel,'tvg_id':channel,'provider':'FSL new public player','host':parsed.hostname,'headers':{'Referer':page},'source_page':page,'expires_at':int(q['e'][0]),'endpoint_sha256':hashlib.sha256(u.encode()).hexdigest(),'identity':'unverified','screening':'test'})
             break
            access.append({'channel':channel,'literal_urls':len(urls),'selected':any(x['tvg_id']==channel for x in rows)})
           except Exception as e:access.append({'channel':channel,'error':str(e)})
          (p/'candidates.json').write_text(json.dumps(rows,indent=2));(p/'public-page-results.json').write_text(json.dumps(access,indent=2))
          print(json.dumps(access))
          
          fox='https://amg00488-foxdigital-fox29philadelphiawtx-vizious-x0v1b.amagi.tv/playlist/amg00488-foxdigital-fox29philadelphiawtx-vizious/playlist.m3u8'
          rows.append({'url':fox,'channel_label':'Fox.us@WTXFTV','tvg_id':'Fox.us@WTXFTV','provider':'WTXF native upstream','host':'amg00488-foxdigital-fox29philadelphiawtx-vizious-x0v1b.amagi.tv','source_page':'https://www.fox29.com/live','endpoint_sha256':hashlib.sha256(fox.encode()).hexdigest(),'identity':'BAM show capture from previous runner; repeat QA required','screening':'test'})
          (p/'candidates.json').write_text(json.dumps(rows,indent=2))
          import concurrent.futures,datetime,hashlib,json,pathlib,subprocess,sys,urllib.request,urllib.error
          sys.path.insert(0,str(pathlib.Path('repo').resolve()) if pathlib.Path('repo/build.py').exists() else str(pathlib.Path('.').resolve()))
          import build
          root=pathlib.Path(sys.argv[1]) if len(sys.argv)>1 else pathlib.Path('provider-validation')
          config=json.load(open('repo/config.json' if pathlib.Path('repo/config.json').exists() else 'config.json'))
          candidates=json.load(open(root/'candidates.json'));results=[]
          kept,quarantined=build.apply_stream_quarantine([dict(c,name=c['channel_label'],source=c['provider']) for c in candidates],config)
          allowed={c['url'] for c in kept}
          candidates=[c for c in candidates if c['url'] in allowed]
          (root/'quarantined.json').write_text(json.dumps(quarantined,indent=2))
          def test(c):
           r={**c,'environment':sys.argv[2] if len(sys.argv)>2 else 'local','tested_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'playlist':{'status':'not-tested'},'segment':{'status':'not-tested'},'burn_in':{'status':'not-tested'},'decode':{'status':'not-tested'},'sustained_av':{'status':'not-tested'}}
           try:
            req=urllib.request.Request(c['url'],headers={'User-Agent':build.USER_AGENT, **c.get('headers',{})})
            with urllib.request.urlopen(req,timeout=8) as p:b=p.read(262144);r['playlist']={'status':('ok' if b.lstrip().startswith(b'#EXTM3U') else 'direct-media' if b[:1]==b'G' and b[188:189]==b'G' else 'invalid'),'http_status':p.status,'bytes':len(b),'final_url':p.url}
           except Exception as e:
            r['playlist']={'status':'failed','error':type(e).__name__,'detail':str(e)}
            return r
           if r['playlist']['status'] not in ('ok','direct-media'):return r
           health=build._probe_stream({'url':c['url'],'headers':c.get('headers',{})},8,True);r['segment']=health
           return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(test,candidates))
          (root/'results.json').write_text(json.dumps(results,indent=2))
          entries=[{'url':r['url'],'name':r['channel_label'],'tvg_id':r['tvg_id'],'source':'Provider catalog validation','family':r['provider'],'quality':'Unknown','headers':r.get('headers',{})} for r in results if r['segment'].get('status')=='ok']
          if entries:
           good,rows,state=build.probe_candidate_entries(entries,config)
           byurl={r['url']:r for r in rows}
           for r in results:
            if r['url'] not in byurl:continue
            health=byurl[r['url']]['health'];r['burn_in']=health
            if health.get('status')!='ok':continue
            stream={'url':r['url'],'health':health,'headers':r.get('headers',{})}
            r['decode']=build._validate_primary_playback_stream(stream,config['stream_health']['primary_playback_qa'])
            if r['decode'].get('status')!='ok':continue
            # Require 60 seconds of BOTH video and audio decoding, in addition to configured repeat/stall QA.
            av_url,av_options=build._verified_wtxf_decoder_input(r['url'],r.get('headers',{}))
            cmd=['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-user_agent',build.USER_AGENT,'-rw_timeout','10000000']+av_options+['-headers',''.join(k+': '+v+'\r\n' for k,v in r.get('headers',{}).items()),'-i',av_url,'-t','60','-map','0:v:0','-map','0:a:0','-progress','pipe:1','-f','null','-']
            try:
             p=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
             times=[int(x.split('=',1)[1]) for x in p.stdout.splitlines() if x.startswith('out_time_us=') and x.split('=',1)[1].isdigit()]
             seconds=max(times,default=0)/1e6
             r['sustained_av']={'status':'ok' if p.returncode==0 and seconds>=60 else 'failed','decoded_seconds':seconds,'exit_code':p.returncode,'error':p.stderr[-1000:]}
            except subprocess.TimeoutExpired:r['sustained_av']={'status':'failed','error':'90-second timeout'}
          (root/'results.json').write_text(json.dumps(results,indent=2))
          for r in results:print(r['provider'],r['channel_label'],r['host'],'playlist',r['playlist'].get('status'),'segment',r['segment'].get('status'),'burn',r['burn_in'].get('status'),'decode',r['decode'].get('status'),'AV60',r['sustained_av'].get('status'))
          
          for row in results:
              if row['decode'].get('status')!='ok':continue
              name=row['tvg_id'].replace('.','-')
              cap_url,cap_options=build._verified_wtxf_decoder_input(row['url'],row.get('headers',{}))
              try:
                  cp=subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-nostdin','-rw_timeout','8000000']+cap_options+['-headers',''.join(k+': '+v+'\r\n' for k,v in row.get('headers',{}).items()),'-i',cap_url,'-frames:v','1','-y',str(root/(name+'.jpg'))],capture_output=True,text=True,timeout=25)
                  row['capture_exit']=cp.returncode
              except subprocess.TimeoutExpired:row['capture_error']='timeout'
          (root/'results.json').write_text(json.dumps(results,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: five-channel-recovery-batch5-fsl-wtxf
          path: five-channel-recovery/batch5/
