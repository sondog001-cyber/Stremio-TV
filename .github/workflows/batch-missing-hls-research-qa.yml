name: Isolated Missing-Channel Batch QA (research only)

on:
  pull_request:
    paths:
      - 'research/batch_missing_hls_qa.py'
      - '.github/workflows/batch-missing-hls-research-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-hls-qa:
    name: HLS research batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        batch: [A, B, C, D]
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Python script and FFmpeg
        run: |
          python3 -m py_compile research/batch_missing_hls_qa.py
          command -v ffmpeg
          ffmpeg -version | head -n 1
      - name: Run isolated playback research (never changes production)
        run: |
          python3 research/batch_missing_hls_qa.py --batch "${{ matrix.batch }}" --output-dir batch-qa-results
      - name: Attach batch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missing-channel-batch-${{ matrix.batch }}-research
          path: batch-qa-results/
          if-no-files-found: warn
          retention-days: 14
