name: Build and deploy Stremio TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "assemble_build.py"
      - "build_parts/**"
      - "tests/**"
      - "config.json"
      - "aliases.json"
      - "manual_sources.json"
      - "research-sources.json"
      - "requirements.txt"
      - ".github/workflows/build-and-deploy.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Assemble builder
        run: python assemble_build.py
      - name: Run builder tests
        run: python -m unittest discover -s tests -v
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start pinned DaddyLive resolver
        shell: bash
        run: |
          set +e
          rm -rf /tmp/daddylive-resolver
          git clone --quiet https://github.com/sharoon7171/daddylive-stream-resolver.git /tmp/daddylive-resolver
          cd /tmp/daddylive-resolver || exit 0
          git checkout --quiet 5064460e16ca78f191473753b5696dea54ea134a
          npm ci --silent
          nohup npm start > /tmp/daddylive-resolver.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "DaddyLive resolver ready"
              exit 0
            fi
            sleep 1
          done
          echo "WARNING: DaddyLive resolver did not start; continuing without it"
          tail -n 100 /tmp/daddylive-resolver.log || true
          exit 0
      - name: Build static Stremio addon
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DADDYLIVE_RESOLVER_URL: http://127.0.0.1:3000
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stremio-tv-diagnostics
          path: |
            site/status.json
            site/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
