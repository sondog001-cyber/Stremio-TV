name: Build and deploy Stremio TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "assemble_build.py"
      - "build_parts/**"
      - "tests/**"
      - "config.json"
      - "aliases.json"
      - "manual_sources.json"
      - "research-sources.json"
      - "requirements.txt"
      - "reliability_watchdog.py"
      - "upstream_exposure.py"
      - "playlist_scrub.py"
      - "provider_discovery.py"
      - "research/playlist-scrub-sources.json"
      - "deployment_guard.py"
      - ".github/workflows/build-and-deploy.yml"
  schedule:
    - cron: "7 */2 * * *"

permissions:
  contents: read

# An automatic two-hour scheduled run must never cancel an already-running
# build/deploy attempt. GitHub serializes Pages runs in this same group.
# Keep the channel coverage/identity deployment guard fully enabled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Assemble builder
        run: python assemble_build.py
      - name: Run builder tests
        run: python -m unittest discover -s tests -v
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start pinned DaddyLive resolver
        shell: bash
        run: |
          set +e
          echo "DADDYLIVE_STARTUP_STATUS=unavailable" >> "$GITHUB_ENV"
          rm -rf /tmp/daddylive-resolver
          git clone --quiet https://github.com/sharoon7171/daddylive-stream-resolver.git /tmp/daddylive-resolver
          cd /tmp/daddylive-resolver || exit 0
          git checkout --quiet 5064460e16ca78f191473753b5696dea54ea134a
          npm ci --silent
          nohup npm start > /tmp/daddylive-resolver.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              echo "DaddyLive resolver ready"
              echo "DADDYLIVE_STARTUP_STATUS=ready" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "WARNING: DaddyLive resolver did not start; continuing without it"
          tail -n 100 /tmp/daddylive-resolver.log || true
          exit 0
      - name: Build static Stremio addon
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DADDYLIVE_RESOLVER_URL: http://127.0.0.1:3000
      - name: Rank shared-host failure and independent-backup risks (advisory)
        continue-on-error: true
        run: python upstream_exposure.py
      - name: Report v0.8 reliability risks (advisory)
        continue-on-error: true
        run: python reliability_watchdog.py
      - name: Fetch previous published channel count (advisory fetch)
        shell: bash
        run: |
          curl --fail --silent --show-error --location --max-time 15 --max-filesize 100000 \
            "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/status.json" \
            -o .previous-deployed-status.json || rm -f .previous-deployed-status.json
      - name: Guard against channel coverage and identity regression
        run: python deployment_guard.py
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stremio-tv-diagnostics
          path: |
            site/status.json
            site/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  playlist-scrub:
    # Runs after deployment (or a blocked build), never gates Pages and never
    # changes source selections. Uses this existing schedule, not another timer.
    needs: [build, deploy]
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scrub dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble trusted builder helpers
        run: python assemble_build.py
      - name: Read this attempt's diagnostics, even if its guard blocked deployment
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: stremio-tv-diagnostics
          path: .scrub-baseline
      - name: Scrub configured playlists and triage up to three unseen candidates
        run: python playlist_scrub.py --discover-providers --new-link-target 20 --branch "$SCRUB_BRANCH"
        env:
          SCRUB_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Save persistent inventory and candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playlist-scrub
          path: scrub-results/
          if-no-files-found: warn
          retention-days: 14

  failure-alert:
    if: ${{ always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open or update a credential-safe build failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Automated Stremio-TV deployment failure"
          body="$(python -c 'import sys; from failure_report import issue_body; print(issue_body(sys.argv[1]))' "$RUN_URL")"
          existing="$(gh issue list --repo "$GH_REPO" --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Automated Stremio-TV deployment failure") | .number' | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "$title" --body "$body"
          fi
