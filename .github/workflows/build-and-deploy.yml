name: Build and deploy Stremio TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "assemble_build.py"
      - "build_parts/**"
      - "config.json"
      - "aliases.json"
      - "manual_sources.json"
      - "research-sources.json"
      - ".github/workflows/build-and-deploy.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Assemble builder
        run: python assemble_build.py
      - name: Build static Stremio addon
        run: python build.py
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stremio-tv-diagnostics
          path: |
            site/status.json
            site/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
