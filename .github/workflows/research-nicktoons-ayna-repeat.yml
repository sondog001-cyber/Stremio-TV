name: Research Nicktoons AynaScope repeat/freeze (no deploy)

on:
  pull_request:
    paths:
      - ".github/workflows/research-nicktoons-ayna-repeat.yml"
      - "research/nicktoons_aynascope_repeat.py"
      - "research/disney_nicktoons_replacement_hunt.py"
      - "research/disney_nicktoons_replacements_20261013.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nicktoons-ayna-three-interval:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install real FFmpeg before the network test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          ffmpeg -version
      - name: Validate safe direct URL and decode three 60s windows with 15s pauses
        run: |
          python3 -m research.nicktoons_aynascope_repeat \
            --pause-seconds 15 \
            --output research-results/replacement/nicktoons-ayna-repeat.json
      - name: Upload aggregate repeat/freeze result, never video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nicktoons-ayna-3x60-continuity
          path: research-results/replacement/nicktoons-ayna-repeat.json
          if-no-files-found: warn
          retention-days: 10
