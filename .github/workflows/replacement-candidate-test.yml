name: Replacement candidate playback test

on:
  push:
    branches: [diagnostic-repetition-sweep]
    paths:
      - "scripts/replacement_candidate_test.py"
      - ".github/workflows/replacement-candidate-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Decode replacement candidates
        run: python scripts/replacement_candidate_test.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: replacement-candidates
          path: replacement-candidates.json
          if-no-files-found: error
          retention-days: 7
