name: Research Feed Identity Validation

on:
  workflow_dispatch:
  push:
    branches: [research-identity-validation]
    paths:
      - ".github/workflows/research-identity-validation.yml"

concurrency:
  group: research-identity-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Inspect research-only feeds
        shell: python
        run: |
          import json, subprocess, urllib.request, urllib.parse, hashlib
          targets = [
            {"label":"Magnolia fresh family","expected":"MagnoliaNetwork.us","url":"http://190.197.41.183/MAGNOLIA_NETWORK/index.m3u8"},
            {"label":"Discovery 89 family","expected":"DiscoveryChannel.us","url":"http://89.105.221.127/Discovery/index.m3u8?token=test"},
            {"label":"TLC 89 family","expected":"TLC.us","url":"http://89.105.221.127/tlc/index.m3u8?token=test"},
            {"label":"Travel 89 family","expected":"TravelChannel.us","url":"http://89.105.221.127/TravelChannel/index.m3u8?token=test"},
            {"label":"HGTV 4.30 family","expected":"HGTV.us","url":"http://4.30.180.36:8420/hgtv/index.m3u8?token=test"},
            {"label":"Discovery 23.237 family","expected":"DiscoveryChannel.us","url":"http://23.237.104.106:8080/USA_DISCOVERY/index.m3u8"},
          ]
          out=[]
          for t in targets:
            row={k:v for k,v in t.items() if k!="url"}
            row["host"]=urllib.parse.urlparse(t["url"]).hostname
            try:
              req=urllib.request.Request(t["url"],headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(req,timeout=12) as r:
                body=r.read(262144)
                row["http_status"]=getattr(r,"status",200)
                row["content_type"]=r.headers.get("Content-Type")
                row["playlist_sha256"]=hashlib.sha256(body).hexdigest()
                text_body=body.decode("utf-8","replace")
                row["is_hls"]="#EXTM3U" in text_body
                row["playlist_lines"]=len(text_body.splitlines())
                row["has_endlist"]="#EXT-X-ENDLIST" in text_body
            except Exception as e:
              row["network_error"]=type(e).__name__+": "+str(e)[:180]
            try:
              p=subprocess.run(["ffprobe","-v","error","-show_entries","stream=index,codec_name,codec_type,width,height,r_frame_rate:format=format_name,duration","-of","json",t["url"]],capture_output=True,text=True,timeout=25)
              row["ffprobe_rc"]=p.returncode
              if p.returncode==0: row["ffprobe"]=json.loads(p.stdout or "{}")
              else: row["ffprobe_error"]=(p.stderr or "")[-500:]
            except Exception as e:
              row["ffprobe_error"]=type(e).__name__+": "+str(e)[:180]
            out.append(row)
          open("identity-research.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
      - name: Full QA for passing Magnolia and HGTV leads
        shell: bash
        run: |
          set +e
          python assemble_build.py
          python - <<'PY'
          import json
          from pathlib import Path
          import build
          targets=[
            {"tvg_id":"MagnoliaNetwork.us","name":"Magnolia Network","url":"http://190.197.41.183/MAGNOLIA_NETWORK/index.m3u8","family":"research-190-197","headers":{}},
            {"tvg_id":"HGTV.us","name":"HGTV","url":"http://4.30.180.36:8420/hgtv/index.m3u8?token=test","family":"research-4-30","headers":{}},
          ]
          out=[]
          for s in targets:
            row={"tvg_id":s["tvg_id"],"family":s["family"]}
            try:
              p1=build._probe_stream(s, timeout=8, verify_segment=True)
              row["probe1"]=p1
              p2=build._probe_stream(s, timeout=8, verify_segment=True)
              row["probe2"]=p2
              if p1.get("status")=="ok" and p2.get("status")=="ok":
                row["burn_in"]=build._validate_direct_media_survival(s,duration_seconds=60,min_decoded_seconds=50,fps=2,timeout_seconds=80,detect_repeated_clips=True,repeat_min_seconds=2,repeat_max_seconds=4,attempts=1,required_passes=1)
                row["final_qa"]=build._validate_direct_media_survival(s,duration_seconds=10,min_decoded_seconds=8,fps=2,timeout_seconds=25,detect_repeated_clips=True,repeat_min_seconds=2,repeat_max_seconds=4,attempts=2,required_passes=1)
            except Exception as e:
              row["error"]=type(e).__name__+": "+str(e)[:300]
            out.append(row)
          Path("full-qa-research.json").write_text(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: identity-research
          path: identity-research.json
          retention-days: 3
