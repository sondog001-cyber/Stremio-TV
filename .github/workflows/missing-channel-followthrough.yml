name: Verify missing-channel leads and fresh exact-ID sources (research only)
on:
  pull_request:
    paths:
      - 'research/missing_channel_followthrough.py'
      - 'research/missing-followthrough-inputs.json'
      - '.github/workflows/missing-channel-followthrough.yml'
permissions:
  contents: read
  actions: read
jobs:
  media-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read immutable latest inventory to exclude already-tested URLs
        uses: actions/download-artifact@v7
        with:
          name: playlist-scrub
          run-id: 39287222103
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .research-inventory
      - name: Install normal QA dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Capture fresh guide and exact-source media without approval
        run: |
          mkdir -p targeted-results
          curl --fail --location --max-time 90 https://vcicio.github.io/US-EPG/merged_epg.xml.gz -o targeted-results/configured-guide.xml.gz || true
          python assemble_build.py
          python -m py_compile research/missing_channel_followthrough.py
          python research/missing_channel_followthrough.py
      - name: Save research evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: missing-channel-followthrough
          path: targeted-results/
          if-no-files-found: warn
          retention-days: 14
