name: Research priority twelve missing-channel sources (no deployment)
on:
  pull_request:
    paths:
      - "research/priority_12_source_sweep.py"
      - ".github/workflows/priority-12-source-sweep.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Read current public GitHub playlists and probe exact-channel media origins
        run: python3 research/priority_12_source_sweep.py
      - name: Upload source QA and provenance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: priority-twelve-origin-research
          path: research/diagnostics/priority-12-source-sweep.json
          retention-days: 14
