name: Decoder Aware Network Test

on:
  push:
    branches: [decoder-aware-stability-v069]
    paths:
      - "config.json"
      - "build.py"
      - "assemble_build.py"
      - "build_parts/**"
      - "tests/**"
      - ".github/workflows/decoder-aware-network-test.yml"

permissions:
  contents: read

jobs:
  decoder-aware-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Assemble builder
        run: python assemble_build.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start pinned resolver
        shell: bash
        run: |
          set +e
          rm -rf /tmp/daddylive-resolver
          git clone --quiet https://github.com/sharoon7171/daddylive-stream-resolver.git /tmp/daddylive-resolver
          cd /tmp/daddylive-resolver || exit 0
          git checkout --quiet 5064460e16ca78f191473753b5696dea54ea134a
          npm ci --silent
          nohup npm start > /tmp/daddylive-resolver.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "WARNING: resolver unavailable; test continues"
          exit 0
      - name: Run full network build
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DADDYLIVE_RESOLVER_URL: http://127.0.0.1:3000
      - name: Verify decoder-aware diagnostics and coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("site/status.json").read_text())
          playback = json.loads(Path("site/diagnostics/playback-classification.json").read_text())
          feedback = json.loads(Path("site/diagnostics/decoder-stability-feedback.json").read_text())
          channels = int(status.get("channels", 0))
          print("Published channels:", channels)
          print("Playback classification:", json.dumps(playback.get("summary", {}), indent=2))
          print("Decoder feedback:", json.dumps({k:v for k,v in feedback.items() if k != "rows"}, indent=2))
          if channels < 65:
              raise SystemExit(f"Coverage regression: {channels} < 65")
          if "hls_alive_decoder_dead" not in playback.get("summary", {}):
              raise SystemExit("Missing playback classification summary")
          if not feedback.get("enabled"):
              raise SystemExit("Decoder stability feedback did not run")
          PY
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decoder-aware-network-diagnostics
          path: |
            site/status.json
            site/diagnostics/
          if-no-files-found: ignore
          retention-days: 3
