name: Validate Stremio TV PR

on:
  pull_request:
    branches: [main]
    paths:
      - "build.py"
      - "assemble_build.py"
      - "build_parts/**"
      - "tests/**"
      - "config.json"
      - "aliases.json"
      - "manual_sources.json"
      - "research-sources.json"
      - "requirements.txt"
      - "reliability_watchdog.py"
      - "upstream_exposure.py"
      - ".github/workflows/pr-validation.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Assemble builder
        run: python assemble_build.py
      - name: Compile builder
        run: python -m py_compile build.py
      - name: Run builder tests
        run: python -m unittest discover -s tests -v

  logo-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Assemble builder
        run: python assemble_build.py
      - name: Generate real channel catalog and logos
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Require zero published generic logo fallbacks
        run: python tests/verify_published_logos.py
      - name: Require protected production coverage in staging
        run: python deployment_guard.py
      - name: Upload logo diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logo-build-audit
          path: |
            site/status.json
            site/diagnostics/
          if-no-files-found: warn
          retention-days: 14
