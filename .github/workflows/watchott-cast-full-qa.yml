name: Watchott Cast Full QA
on:
  push:
    branches: [research-identity-validation]
    paths: [".github/workflows/watchott-cast-full-qa.yml"]
permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Start pinned resolver
        shell: bash
        run: |
          set -e
          rm -rf /tmp/daddylive-resolver
          git clone --quiet https://github.com/sharoon7171/daddylive-stream-resolver.git /tmp/daddylive-resolver
          cd /tmp/daddylive-resolver
          git checkout --quiet 5064460e16ca78f191473753b5696dea54ea134a
          npm ci --silent
          nohup npm start >/tmp/daddylive-resolver.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 /tmp/daddylive-resolver.log
          exit 1
      - name: Full cast QA
        shell: python
        run: |
          import urllib.request, urllib.error, urllib.parse, json, time, re, hashlib, subprocess, concurrent.futures

          base="http://127.0.0.1:3000"
          targets=[
            ("Bravo.us","Bravo",307),
            ("CBSSportsNetwork.us","CBS Sports Network",308),
            ("DiscoveryChannel.us","Discovery Channel",313),
            ("FXX.us","FXX USA",298),
            ("FoxSports2.us","Fox Sports 2 USA",758),
            ("HGTV.us","HGTV",382),
            ("InvestigationDiscovery.us","Investigation Discovery (ID USA)",324),
            ("MLBNetwork.us","MLB Network USA",399),
            ("NBCSportsPhiladelphia.us","NBC Sports Philadelphia",777),
            ("Nicktoons.us","Nicktoons",649),
            ("OWN.us","Oprah Winfrey Network (OWN)",331),
            ("Reelz.us","Reelz Channel",293),
            ("SmithsonianChannel.us","Smithsonian Channel",603),
            ("SundanceTV.us","Sundance TV",658),
            ("TLC.us","TLC",337),
            ("WeatherChannel.us","The Weather Channel",394),
            ("TravelChannel.us","Travel Channel",340),
            ("FXMovieChannel.us","FX Movie Channel",381),
            ("MagnoliaNetwork.us","Magnolia Network",299),
            ("FX.us","FX USA",317),
            ("TVLand.us","TVLAND",342),
            ("Showtime.us","Showtime USA",333),
            ("StarzComedy.us","Starz Comedy",971),
            ("IFC.us","IFC TV USA",656),
          ]

          def headers_from_vlc(cmd):
            h={}
            m=re.search(r":http-user-agent='([^']+)'",cmd or "")
            if m:h["User-Agent"]=m.group(1)
            m=re.search(r":http-referrer='([^']+)'",cmd or "")
            if m:h["Referer"]=m.group(1)
            return h

          def get(url,headers=None,limit=131072,timeout=15):
            q=urllib.request.Request(url,headers=headers or {"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(q,timeout=timeout) as r:
              return r.status,r.geturl(),r.headers.get("Content-Type") or "",r.read(limit)

          def first_media_segment(url,h):
            st,final,ct,b=get(url,h,131072,15)
            txt=b.decode("utf-8","replace")
            if not txt.lstrip().startswith("#EXTM3U"):
              return {"ok":False,"error":"not-hls","status":st,"content_type":ct}
            def uri(t):
              for line in t.splitlines():
                line=line.strip()
                if line and not line.startswith("#"):return line
            child=uri(txt)
            if not child:return {"ok":False,"error":"no-child"}
            child=urllib.parse.urljoin(final,child)
            st2,f2,ct2,b2=get(child,h,131072,15)
            txt2=b2.decode("utf-8","replace")
            if txt2.lstrip().startswith("#EXTM3U"):
              child2=uri(txt2)
              if not child2:return {"ok":False,"error":"no-segment"}
              st2,f2,ct2,b2=get(urllib.parse.urljoin(f2,child2),h,131072,15)
            kind="unknown"
            if len(b2)>188 and b2[0]==0x47 and b2[188]==0x47:kind="mpeg-ts"
            elif b2.startswith(b"\x89PNG\r\n\x1a\n"):kind="png"
            elif len(b2)>=12 and b2[:4]==b"RIFF" and b2[8:12]==b"WEBP":kind="webp"
            elif len(b2)>=12 and b2[4:8]==b"ftyp":kind="isobmff"
            return {"ok":st2==200 and kind in {"mpeg-ts","isobmff"},"status":st2,"content_type":ct2,"kind":kind,"host":urllib.parse.urlparse(f2).hostname}

          def ff_args(url,h):
            args=[]
            if h.get("User-Agent"): args += ["-user_agent",h["User-Agent"]]
            if h.get("Referer"): args += ["-referer",h["Referer"]]
            args += ["-i",url]
            return args

          def probe_info(url,h):
            cmd=["ffprobe","-v","error"]+ff_args(url,h)[:-2]+["-i",url,"-show_entries","stream=index,codec_type,codec_name,width,height,r_frame_rate","-of","json"]
            try:
              z=subprocess.run(cmd,capture_output=True,text=True,timeout=35)
              return {"exit":z.returncode,"streams":json.loads(z.stdout or "{}").get("streams",[]),"stderr_tail":z.stderr[-800:]}
            except Exception as e:return {"error":type(e).__name__+": "+str(e)}

          def decode(url,h,seconds,timeout):
            cmd=["ffmpeg","-hide_banner","-loglevel","warning"]+ff_args(url,h)[:-2]+["-i",url,"-t",str(seconds),"-vf","fps=2,framemd5","-f","framemd5","-"]
            try:
              z=subprocess.run(cmd,capture_output=True,text=True,timeout=timeout)
              hashes=[x.rsplit(",",1)[-1].strip() for x in z.stdout.splitlines() if x and not x.startswith("#") and "," in x]
              return {
                "exit":z.returncode,
                "frames":len(hashes),
                "decoded_seconds":round(len(hashes)/2,1),
                "unique_frames":len(set(hashes)),
                "repeat_ratio":round(1-len(set(hashes))/len(hashes),4) if hashes else None,
                "stderr_tail":z.stderr[-1200:]
              }
            except subprocess.TimeoutExpired:
              return {"error":"timeout"}
            except Exception as e:return {"error":type(e).__name__+": "+str(e)}

          def one(t):
            tvg,name,cid=t
            row={"tvg_id":tvg,"name":name,"channel_id":cid,"server":"cast"}
            try:
              q=urllib.parse.urlencode({"channel":cid,"server":"cast"})
              st,_,_,b=get(base+"/api/resolve?"+q,{"User-Agent":"Mozilla/5.0","Accept":"application/json"},1000000,25)
              p=json.loads(b.decode("utf-8"))
              direct=str(p.get("direct") or "")
              h=headers_from_vlc(str(p.get("vlc") or ""))
              row["resolve_status"]=st
              row["direct_host"]=urllib.parse.urlparse(direct).hostname if direct else None
              row["has_referer"]=bool(h.get("Referer")); row["has_user_agent"]=bool(h.get("User-Agent"))
              if not direct.startswith(("http://","https://")):return row
              row["probe1"]=first_media_segment(direct,h)
              time.sleep(5)
              row["probe2"]=first_media_segment(direct,h)
              if row["probe1"].get("ok") and row["probe2"].get("ok"):
                row["media_info"]=probe_info(direct,h)
                row["burn_in_60s"]=decode(direct,h,60,100)
                time.sleep(3)
                row["final_10s"]=decode(direct,h,10,40)
            except urllib.error.HTTPError as e:
              row["resolve_status"]=e.code; row["error"]="HTTP "+str(e.code)
            except Exception as e:
              row["error"]=type(e).__name__+": "+str(e)[:300]
            return row

          rows=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for row in ex.map(one,targets):
              rows.append(row)
              print(json.dumps(row,indent=2))

          for r in rows:
            burn=r.get("burn_in_60s") or {}
            final=r.get("final_10s") or {}
            r["qa_pass"]=bool(
              (r.get("probe1") or {}).get("ok") and
              (r.get("probe2") or {}).get("ok") and
              burn.get("decoded_seconds",0)>=50 and
              final.get("decoded_seconds",0)>=8 and
              burn.get("repeat_ratio",1)<0.95 and
              final.get("repeat_ratio",1)<0.95
            )
          summary={
            "targets":len(rows),
            "resolved":sum(1 for r in rows if r.get("resolve_status")==200),
            "double_media_probe_pass":sum(1 for r in rows if (r.get("probe1") or {}).get("ok") and (r.get("probe2") or {}).get("ok")),
            "full_qa_pass":sum(1 for r in rows if r.get("qa_pass")),
            "passed":[r["tvg_id"] for r in rows if r.get("qa_pass")],
            "failed":[r["tvg_id"] for r in rows if not r.get("qa_pass")],
          }
          open("watchott-cast-full-qa.json","w").write(json.dumps({"summary":summary,"results":rows},indent=2))
          print("SUMMARY",json.dumps(summary,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchott-cast-full-qa
          path: watchott-cast-full-qa.json
          retention-days: 3
