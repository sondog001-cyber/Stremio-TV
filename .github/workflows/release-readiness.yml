name: Audit v0.9.0 release evidence (no deployment)

on:
  workflow_run:
    workflows: [Build and deploy Stremio TV]
    types: [completed]
  workflow_dispatch:
  pull_request:
    paths:
      - "release_readiness.py"
      - "tests/test_release_readiness.py"
      - "research/v0.9.0-original-lineup.json"
      - ".github/workflows/release-readiness.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-evidence-${{ github.event_name }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run always uses trusted default-branch code, never triggering head code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test release evidence rules
        run: python -m unittest discover -s tests -p test_release_readiness.py -v
      - name: Audit actual scheduled production attempts and artifacts (read only)
        run: python release_readiness.py --repository "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release evidence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v0.9.0-release-readiness
          path: release-audit/
          if-no-files-found: warn
          retention-days: 30
