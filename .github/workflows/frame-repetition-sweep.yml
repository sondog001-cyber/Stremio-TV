name: Full decoded-frame repetition sweep

on:
  push:
    branches: [diagnostic-repetition-sweep]
    paths:
      - "scripts/frame_repetition_sweep.py"
      - ".github/workflows/frame-repetition-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 1
      - name: Decode every published primary channel and detect repeated clips
        run: |
          python scripts/frame_repetition_sweep.py \
            --preview-url "https://sondog001-cyber.github.io/Stremio-TV/diagnostics/stremio-preview.json" \
            --seconds 18 \
            --workers 8 \
            --timeout 32 \
            --fps 2 \
            --output frame-repetition-sweep.json
      - name: Upload frame repetition diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frame-repetition-sweep
          path: frame-repetition-sweep.json
          if-no-files-found: error
          retention-days: 7
