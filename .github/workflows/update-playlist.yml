name: Update combined IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge US national + Philadelphia local playlists
        run: python merge_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add combined.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Update combined IPTV playlist"
            git push
          fi
