name: TVPass Research
on:
  push:
    branches: [research-identity-validation]
    paths: [".github/workflows/tvpass-research.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate TVPass public channel pages
        shell: python
        run: |
          import json, urllib.request, urllib.error, time
          targets=[
            ("HGTV.us","HGTV","https://tvpass.org/live/HGTVEast/hd"),
            ("Reelz.us","Reelz","https://tvpass.org/live/Reelz/hd"),
            ("DiscoveryChannel.us","Discovery","https://tvpass.org/live/Discovery/hd"),
            ("TLC.us","TLC","https://tvpass.org/live/TLC/hd"),
            ("TravelChannel.us","Travel","https://tvpass.org/live/Travel/hd"),
            ("FXX.us","FXX","https://tvpass.org/live/FXX/hd"),
            ("FX.us","FX","https://tvpass.org/live/FX/hd"),
            ("TVLand.us","TV Land","https://tvpass.org/live/TVLand/hd"),
          ]
          variants=[
            ("baseline",{}),
            ("ordinary-public",{"User-Agent":"Mozilla/5.0","Referer":"https://tvpass.org/","Origin":"https://tvpass.org","Accept":"application/vnd.apple.mpegurl,*/*"})
          ]
          out=[]
          for tvg,name,url in targets:
            item={"tvg_id":tvg,"name":name,"page_url":url,"requests":[]}
            for v,h in variants:
              r={"variant":v}
              try:
                q=urllib.request.Request(url,headers=h)
                with urllib.request.urlopen(q,timeout=12) as x:
                  b=x.read(8192)
                  r.update(status=getattr(x,"status",200),final_url=x.geturl(),content_type=x.headers.get("Content-Type"),is_hls=b.lstrip().startswith(b"#EXTM3U"),sample=b[:300].decode("utf-8","replace"))
              except urllib.error.HTTPError as e: r.update(status=e.code,error=str(e))
              except Exception as e: r.update(status=None,error=type(e).__name__+": "+str(e)[:200])
              item["requests"].append(r)
            out.append(item)
          open("tvpass-resolution.json","w").write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: tvpass-research
          path: |
            tvpass-resolution.json
          retention-days: 3
